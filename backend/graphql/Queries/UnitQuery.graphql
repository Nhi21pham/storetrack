extend type Query {
    units(store_id: ID!, include_inactive: Boolean): [Unit!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\UnitResolver@all")

    unit(id: ID!): Unit
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\UnitResolver@findById")

    searchUnits(store_id: ID!, q: String!, include_inactive: Boolean, limit: Int): [Unit!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\UnitResolver@search")
}
