extend type Query {
    customers(store_id: ID, business_id: ID!): [Customer!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\CustomerResolver@all")

    customer(id: ID!): Customer
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\CustomerResolver@findById")
}
