extend type Query {
    invoices(store_id: ID!, type: InvoiceType): [Invoice!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\Invoice\\InvoiceResolver@all")

    invoice(id: ID!): Invoice
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\Invoice\\InvoiceResolver@findById")

    invoicesForProduct(product_id: ID!): [Invoice!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\Invoice\\InvoiceResolver@forProduct")

    productStocks(store_id: ID!): [ProductStock!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\Invoice\\InvoiceResolver@productStocks")

    inventoryBatches(store_id: ID!): [InventoryBatch!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\Invoice\\InvoiceResolver@inventoryBatches")
}
