type Customer {
    id: ID!
    store_id: ID
    name: String!
    email: String
    phone: String
    address: String
    tax_code: String
    party: Party! @belongsTo
    stores: [Store!]! @belongsToMany
    outstanding: Float
    business_outstanding: Float
    created_at: DateTime!
    updated_at: DateTime!
}
