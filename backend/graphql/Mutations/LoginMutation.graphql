extend type Mutation {
    login(
        email: String!
        password: String!
    ): LoginResponse!
    @throttle(maxAttempts: 5, decayMinutes: 1)
    @field(resolver: "App\\GraphQL\\Mutations\\LoginResolver@login")

    logout: Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\LoginResolver@logout")
}

type LoginResponse {
    message: String!
    token: String!
    user: User!
}