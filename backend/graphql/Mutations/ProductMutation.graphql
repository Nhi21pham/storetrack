extend type Mutation {
    createProduct(store_id: ID!, input: CreateProductInput! @spread): Product!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\ProductResolver@create")

    updateProduct(id: ID!, input: UpdateProductInput! @spread): Product!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\ProductResolver@update")

    deleteProduct(id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\ProductResolver@delete")

    bulkAttachProductTags(store_id: ID!, input: BulkAttachProductTagsInput! @spread): [Product!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\ProductResolver@bulkAttachTags")
}

input CreateProductInput {
    name: String! @rules(apply: ["required", "string", "min:1", "max:255"])
    product_category_id: ID! @rules(apply: ["required", "integer"])
    unit_id: ID! @rules(apply: ["required", "integer"])
    tags: [ProductTagInput!]
}

input UpdateProductInput {
    name: String @rules(apply: ["sometimes", "string", "min:1", "max:255"])
    product_category_id: ID @rules(apply: ["sometimes", "integer"])
    unit_id: ID @rules(apply: ["sometimes", "integer"])
    is_active: Boolean @rules(apply: ["sometimes", "boolean"])
    tags: [ProductTagInput!]
}

input ProductTagInput {
    tag_id: ID! @rules(apply: ["required", "integer"])
    tag_value_id: ID @rules(apply: ["sometimes", "nullable", "integer"])
}

input BulkAttachProductTagsInput {
    product_ids: [ID!]! @rulesForArray(apply: ["required", "min:1"])
    tags: [ProductTagInput!]! @rulesForArray(apply: ["required", "min:1"])
}
