extend type Mutation {
    createTax(store_id: ID!, input: CreateTaxInput! @spread): Tax!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\TaxResolver@create")

    updateTax(id: ID!, input: UpdateTaxInput! @spread): Tax!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\TaxResolver@update")

    deleteTax(id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\TaxResolver@delete")
}

input CreateTaxInput {
    name: String! @rules(apply: ["required", "string", "min:1", "max:100"])
    description: String @rules(apply: ["sometimes", "nullable", "string", "max:500"])
}

input UpdateTaxInput {
    name: String @rules(apply: ["sometimes", "string", "min:1", "max:100"])
    description: String @rules(apply: ["sometimes", "nullable", "string", "max:500"])
    is_active: Boolean @rules(apply: ["sometimes", "boolean"])
}
