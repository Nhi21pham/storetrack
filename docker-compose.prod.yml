services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - export_temp:/var/www/html/storage/app/temp
      - backup_data:/var/www/html/storage/backups
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./backend:/var/www/html
      - ./frontend/dist:/srv/frontend
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: unless-stopped
    networks:
      - app-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_worker
    user: www-data
    command: php artisan horizon
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - export_temp:/var/www/html/storage/app/temp
      - backup_data:/var/www/html/storage/backups
    networks:
      - app-network
    depends_on:
      - redis
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler
    user: www-data
    command: php artisan schedule:work --verbose --no-interaction
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - export_temp:/var/www/html/storage/app/temp
      - backup_data:/var/www/html/storage/backups
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  export_temp:
  backup_data:
  caddy_data:
  caddy_config:
